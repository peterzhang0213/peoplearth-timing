<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nanxi · 实时排名大屏</title>
  <style>
    :root { --yellow:#fff04f; --yellow-strong:#f2da00; --black:#0a0a08; --ink:#fff04f; --panel:#12120f; --line:#514b13; --muted:#c9be2e; --white:#f5f5f5; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--black); color:var(--yellow); font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif; }
    .screen { width:min(1600px,100%); min-height:100vh; margin:auto; padding:28px 42px 42px; }
    .topbar { display:flex; justify-content:space-between; align-items:center; color:var(--yellow); font-size:15px; letter-spacing:.12em; text-transform:uppercase; }
    .live { display:flex; align-items:center; gap:8px; font-weight:800; }
    .live::before { content:""; width:10px; height:10px; border-radius:50%; background:var(--ink); }
    .clock { color:#c9be2e; font-variant-numeric:tabular-nums; }
    .brand { display:grid; place-items:center; padding:clamp(24px,4vw,60px) 0; }
    .brand img { display:block; width:100%; max-width:675px; height:auto; object-fit:contain; background:transparent; filter:brightness(0) saturate(100%) invert(85%) sepia(94%) saturate(1260%) hue-rotate(4deg) brightness(104%) contrast(103%); }
    .heading { display:flex; align-items:flex-end; justify-content:space-between; gap:20px; border-bottom:2px solid var(--yellow); padding-bottom:22px; }
    .heading h1 { margin:0; font-size:clamp(30px,3.5vw,58px); color:var(--yellow); line-height:.95; letter-spacing:-.05em; }
    .heading p { display:none; }
    .day-switch, .group-switch { display:flex; flex-wrap:wrap; gap:8px; }
    button { border:2px solid var(--yellow); border-radius:2px; background:transparent; color:var(--yellow); padding:11px 16px; font:inherit; font-weight:900; cursor:pointer; }
    button.active { border-color:var(--yellow); background:var(--yellow); color:var(--black); }
    .group-switch { margin:22px 0 14px; }
    .group-switch button { padding:11px 15px; font-size:15px; }
    .board { border-top:6px solid var(--yellow); background:var(--panel); }
    .board-head, .row { display:grid; grid-template-columns:84px minmax(220px,1fr) 150px 180px 100px; align-items:center; column-gap:16px; }
    .board-head { position:sticky; top:0; z-index:1; min-height:58px; padding:0 22px; background:var(--yellow); color:var(--black); font-size:15px; font-weight:900; letter-spacing:.1em; }
    .board-head span:nth-child(5), .board-head span:nth-child(6) { text-align:right; }
    .row { min-height:132px; padding:12px 22px 14px; border-bottom:2px solid var(--line); font-size:18px; grid-template-rows:minmax(72px,auto) auto; }
    .row:nth-child(even) { background:#1c1c12; }
    .rank { color:var(--yellow); font-size:34px; font-weight:950; font-variant-numeric:tabular-nums; }
    .id, .time { font-family:"SFMono-Regular",Consolas,monospace; font-variant-numeric:tabular-nums; }
    .id { color:#c9be2e; font-size:17px; }
    .name { min-width:0; font-size:26px; color:var(--yellow); font-weight:950; line-height:1.35; overflow-wrap:anywhere; }
    .members { display:block; margin-top:6px; color:#c9be2e; font-size:17px; font-weight:600; }
    .time { justify-self:end; color:var(--yellow); font-size:28px; font-weight:950; }
    .deduction, .penalty { display:block; margin-top:5px; color:#c9be2e; font-family:Arial,"PingFang SC",sans-serif; font-size:14px; font-weight:900; }
    .status { justify-self:end; color:#c9be2e; font-size:15px; font-weight:900; }
    .station-strip { grid-column:1 / -1; display:grid; grid-template-columns:repeat(var(--station-count,8),minmax(0,1fr)); gap:6px; }
    .station { display:grid; gap:3px; padding:6px 8px; border-left:2px solid #514b13; }
    .station strong { color:#c9be2e; font-size:12px; letter-spacing:.06em; }
    .station span { color:var(--white); font-family:"SFMono-Regular",Consolas,monospace; font-size:15px; font-weight:800; font-variant-numeric:tabular-nums; }
    .footer { display:flex; justify-content:space-between; gap:20px; margin-top:18px; color:#c9be2e; font-size:14px; font-weight:800; }
    @media (max-width: 1200px) {
      .screen { padding:18px 16px 28px; }
      .board-head, .row { grid-template-columns:40px minmax(0,1fr) 110px 140px 64px; column-gap:10px; padding-left:12px; padding-right:12px; }
      .time { font-size:21px; }
      .name { font-size:20px; }
      .members { font-size:15px; }
    }
    @media (max-width: 640px) {
      .heading { align-items:flex-start; flex-direction:column; }
      .board-head, .row { grid-template-columns:28px minmax(0,1fr) 108px; column-gap:8px; }
      .board-head { font-size:10px; letter-spacing:0; }
      .board-head span:nth-child(3), .board-head span:nth-child(5) { display:none; }
      .row { grid-template-rows:auto auto auto; row-gap:6px; }
      .rank { grid-column:1; grid-row:1 / 3; font-size:22px; }
      .name { grid-column:2; grid-row:1; font-size:15px; }
      .time { grid-column:3; grid-row:1; }
      .id { grid-column:2; grid-row:2; font-size:12px; }
      .status { grid-column:3; grid-row:2; }
      .members { font-size:12px; }
      .station-strip { grid-row:3; grid-template-columns:repeat(3,minmax(0,1fr)); }
      .footer { font-size:11px; }
    }
    /* Keep the original single-column design; only the ranking body scrolls. */
    .screen { height:100vh; height:100dvh; display:flex; flex-direction:column; }
    .topbar,.brand,.heading,.group-switch,.footer { flex-shrink:0; }
    .brand { padding:clamp(16px,2vh,32px) 0; }
    .brand img { max-height:22vh; }
    .board { display:flex; flex-direction:column; flex:1; min-height:160px; }
    .board-head { flex-shrink:0; }
    #rows { min-height:0; flex:1; overflow-y:auto; scrollbar-width:none; overflow-anchor:none; }
    #rows::-webkit-scrollbar { display:none; }
    .scroll-control { padding:4px 10px; font-size:12px; }
    @media (max-width:640px) {
      .screen { padding:12px; }
      .brand { padding:12px 0; }
      .brand img { max-height:14vh; }
      .heading { gap:10px; padding-bottom:12px; }
      .heading h1 { font-size:26px; }
      .day-switch button,.group-switch button { padding:7px 9px; font-size:12px; }
      .group-switch { margin:12px 0; }
      .board-head { min-height:36px; }
      .footer { flex-wrap:wrap; gap:6px; margin-top:10px; }
    }
  </style>
</head>
<body>
  <main class="screen">
    <div class="topbar"><span class="live">LIVE RANKING</span><span class="clock" id="clock"></span></div>
    <div class="brand"><img src="./assets/nanxi-main-visual-cropped.svg" alt="Nanxi主视觉"></div>
    <section class="heading">
      <div><h1 id="title">全部组别</h1></div>
      <div class="day-switch"><button class="active" data-day="19">9 月 19 日</button><button data-day="20">9 月 20 日</button></div>
    </section>
    <div class="group-switch" id="groups"></div>
    <section class="board" aria-label="排行榜">
      <div class="board-head"><span>RANK</span><span id="nameHeading">NAME</span><span>选手号</span><span id="timeHeading">TIME</span><span>STATUS</span></div>
      <div id="rows"></div>
    </section>
    <div class="footer"><span id="mockCount">等待成绩</span><button id="scrollToggle" class="scroll-control" aria-pressed="true">暂停滚动</button><span id="connection" role="status">正在读取成绩…</span></div>
  </main>
  <script>
    (() => {
      const startedAt = Date.now();
      const showDependencyError = () => {
        if (window.Nanxi && window.timingApiFetch) return;
        const status = document.querySelector('#connection, #message');
        if (status) {
          status.textContent = '成绩脚本未加载成功，请刷新页面或检查网络连接。';
          status.classList.add('error');
        }
        const output = document.querySelector('#rows, #entries');
        if (output && !output.textContent.trim()) output.textContent = '暂时无法读取成绩';
      };
      const timer = setInterval(() => {
        if (window.Nanxi && window.timingApiFetch) clearInterval(timer);
        else if (Date.now() - startedAt > 12000) { clearInterval(timer); showDependencyError(); }
      }, 250);
      window.addEventListener('error', event => {
        if (event.target?.tagName === 'SCRIPT') showDependencyError();
      }, true);
    })();
  </script>
  <script src="./timing-api.js?v=20260919-2" defer></script><script src="./nanxi.js?v=20260919-3" defer></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      if (!window.Nanxi || !window.timingApiFetch) return;
    const N = Nanxi, $ = selector=>document.querySelector(selector), params = new URLSearchParams(location.search);
    const demo = params.get('demo') === '1';
    let day = params.get('day') === '20' || params.get('raceId') === N.races[20] ? '20' : '19';
    let group = params.get('group') === 'all' || N.codes(day).includes(params.get('group')) ? (params.get('group') || 'all') : 'all';
    let payload = null, version = 0, loading = false, controller = null;
    const scroller = $('#rows');
    let autoScroll = true, scrollPosition = 0, lastFrame = 0, holdUntil = performance.now() + 2500, atEnd = false;
    function resetScroll() {
      scroller.scrollTop = 0; scrollPosition = 0; atEnd = false;
      holdUntil = performance.now() + 2500;
    }
    function scrollFrame(now) {
      const dt = Math.min(now - (lastFrame || now), 100);
      lastFrame = now;
      const end = Math.max(0, scroller.scrollHeight - scroller.clientHeight);
      if (autoScroll && document.visibilityState === 'visible' && now >= holdUntil && end > 1) {
        if (atEnd) resetScroll();
        else {
          scrollPosition = Math.min(end, scrollPosition + dt * 0.025);
          scroller.scrollTop = scrollPosition;
          if (scrollPosition >= end) { atEnd = true; holdUntil = now + 2500; }
        }
      }
      requestAnimationFrame(scrollFrame);
    }
    $('#scrollToggle').addEventListener('click', () => {
      autoScroll = !autoScroll;
      $('#scrollToggle').textContent = autoScroll ? '暂停滚动' : '继续滚动';
      $('#scrollToggle').setAttribute('aria-pressed', String(autoScroll));
      scrollPosition = scroller.scrollTop; atEnd = false;
      holdUntil = performance.now() + 1000;
    });
    scroller.addEventListener('scroll', () => {
      if (Math.abs(scroller.scrollTop - scrollPosition) > 2) {
        scrollPosition = scroller.scrollTop; atEnd = false;
        holdUntil = performance.now() + 5000;
      }
    });
    document.addEventListener('visibilitychange', () => {lastFrame=0;});
    requestAnimationFrame(scrollFrame);
    const labels = {finished:'已完赛',racing:'比赛中',not_started:'未开始',paused:'暂停',dnf:'退赛',dns:'未出发'};
    document.querySelector('.day-switch').hidden = false;
    function controls() {
      $('#title').textContent = group === 'all' ? '全部组别' : N.groups[group].label;
      $('#groups').innerHTML = [`<button class="${group==='all'?'active':''}" aria-pressed="${group==='all'}" data-group="all">全部组别</button>`, ...N.codes(day).map(code=>`<button class="${code===group?'active':''}" aria-pressed="${code===group}" data-group="${code}">${N.groups[code].label}</button>`)].join('');
      document.querySelectorAll('[data-day]').forEach(button=>button.classList.toggle('active',button.dataset.day===day));
      $('#nameHeading').textContent = group === 'all' ? 'NAME / TEAM' : N.groups[group].size===1?'NAME':'TEAM / MEMBERS';
    }
    function render() {
      const entries = (payload?.leaderboard || []).filter(row=>group === 'all' || N.categoryForRow(row) === group);
      $('#mockCount').textContent = `${demo?'演示成绩 · ':''}${entries.length} 个参赛单位`;
      const previousTop = scroller.scrollTop;
      const markup = entries.length ? entries.map(row=>`<div class="row">
        <span class="rank">${row.status==='finished' ? row.categoryRank ?? row.rank ?? '—' : '—'}</span>
        <span class="name">${N.escape(row.athleteName)}${N.memberCaption(row)?`<small class="members">${N.escape(N.memberCaption(row))}</small>`:''}</span>
        <span class="id">${N.escape(row.bibNumber)}</span>
        <span class="time">${N.duration(row.elapsedMs)}<small class="penalty">罚时 +${N.duration(row.penaltyMs || 0)}</small>${day==='20'?`<small class="deduction">减时 −${N.duration(row.deductionMs || 0)}</small>`:''}</span>
        <span class="status">${labels[row.status]||'待确认'}</span>
        <div class="station-strip" style="--station-count:${payload.race.stationCount}">${Array.from({length:payload.race.stationCount},(_,i)=>`<div class="station"><strong>S${i+1}</strong><span>${N.duration(row.stationSplits?.[`station${i+1}Ms`])}</span></div>`).join('')}</div>
      </div>`).join('') : `<div style="padding:30px">${payload?'该组别暂无参赛成绩':'正在读取成绩…'}</div>`;
      if (scroller.innerHTML !== markup) scroller.innerHTML = markup;
      scroller.scrollTop = previousTop;
      scrollPosition = scroller.scrollTop;

    }
    async function refresh() {
      if (loading) return; loading=true; const current=version;
      const requestController=new AbortController(); controller=requestController; const timeout=setTimeout(()=>requestController.abort(),10000);
      try { const next=demo?N.mock(day):await N.fetchResults(day,controller.signal);if(current!==version)return;payload=next;render();$('#connection').textContent=`${demo?'演示':'已更新'} ${new Date(next.generatedAt).toLocaleTimeString('zh-CN',{hour12:false})}`; }
      catch(error) {if(current===version) {$('#connection').textContent=`${N.resultError(error)} · ${payload?'保留上次成绩，':''}正在重试`;if(!payload)$('#rows').textContent='暂时无法读取成绩';}}
      finally {clearTimeout(timeout);if(current===version)loading=false;}
    }
    $('#groups').addEventListener('click',event=>{const button=event.target.closest('[data-group]');if(!button)return;group=button.dataset.group;controls();render();resetScroll();});
      document.querySelectorAll('[data-day]').forEach(button=>button.addEventListener('click',()=>{version++;controller?.abort();loading=false;payload=null;day=button.dataset.day;group='all';controls();render();resetScroll();refresh();}));
    controls();render();refresh();setInterval(()=>{if(document.visibilityState==='visible')refresh();},3000);
    setInterval(()=>$('#clock').textContent=new Date().toLocaleTimeString('zh-CN',{hour12:false}),1000);
    });
  </script>
</body>
</html>
