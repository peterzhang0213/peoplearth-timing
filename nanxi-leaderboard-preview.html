<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nanxi · 实时排名大屏</title>
  <style>
    :root { --yellow:#fff04f; --yellow-strong:#f2da00; --black:#0a0a08; --ink:#fff04f; --panel:#12120f; --line:#514b13; --muted:#c9be2e; --white:#f5f5f5; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--black); color:var(--yellow); font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif; }
    .screen { width:100%; min-height:100vh; margin:auto; padding:1.2vh 1.6vw; display:flex; flex-direction:column; gap:.7vh; }
    .topbar,.heading,.footer { display:flex; justify-content:space-between; align-items:center; gap:12px; }
    .topbar { font-size:clamp(12px,1vw,22px); letter-spacing:.12em; }
    .live { font-weight:800; }
    .live::before { content:"●"; margin-right:8px; }
    .clock,.footer { color:#c9be2e; font-variant-numeric:tabular-nums; }
    .brand { display:grid; place-items:center; height:8vh; flex:none; }
    .brand img { width:min(48vw,760px); height:100%; max-height:8vh; object-fit:contain; filter:brightness(0) saturate(100%) invert(85%) sepia(94%) saturate(1260%) hue-rotate(4deg) brightness(104%) contrast(103%); }
    .heading { border-bottom:2px solid var(--yellow); padding-bottom:.8vh; }
    .heading h1 { margin:0; font-size:clamp(24px,2vw,44px); line-height:1; }
    .day-switch,.group-switch,.pagination { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
    button { border:1px solid var(--yellow); border-radius:2px; background:transparent; color:var(--yellow); padding:.6vh .8vw; font:inherit; font-size:clamp(12px,1vw,22px); font-weight:800; cursor:pointer; }
    button.active { background:var(--yellow); color:var(--black); }
    button:disabled { opacity:.4; cursor:default; }
    .board { flex:1; min-height:0; }
    #rows { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:1.4vw; height:100%; grid-template-rows:minmax(0,1fr); }
    .board-column { min-width:0; min-height:0; display:grid; grid-template-rows:auto repeat(10,minmax(0,1fr)); background:var(--panel); }
    .board-head,.row-main { display:grid; grid-template-columns:2.2em minmax(0,1fr) auto; align-items:center; gap:.6vw; }
    .board-head { background:var(--yellow); color:var(--black); padding:.5vh .7vw; font-size:clamp(12px,1vw,22px); font-weight:900; }
    .board-head span:last-child { text-align:right; }
    .row { flex:1; min-height:0; display:flex; flex-direction:column; justify-content:center; gap:.25vh; padding:.3vh .7vw; border-bottom:1px solid var(--line); }
    .row:nth-child(odd) { background:#1c1c12; }
    .row-main { font-size:clamp(16px,1.35vw,30px); }
    .rank { font-size:1.2em; font-weight:950; font-variant-numeric:tabular-nums; }
    .name { min-width:0; font-weight:900; overflow-wrap:anywhere; line-height:1.15; }
    .id { color:#c9be2e; font-size:.65em; margin-right:.6em; white-space:nowrap; }
    .members { display:block; font-size:.62em; color:var(--white); font-weight:500; margin-top:.3vh; line-height:1.2; }
    .time { text-align:right; font-weight:900; font-variant-numeric:tabular-nums; font-family:Consolas,monospace; }
    .result-meta { display:block; color:#c9be2e; font:600 clamp(10px,.66vw,15px) Arial,"PingFang SC",sans-serif; margin-top:.3vh; }
    .station-strip { display:grid; grid-template-columns:repeat(var(--station-count,8),minmax(0,1fr)); gap:3px; }
    .station { display:flex; flex-direction:column; gap:1px; border-left:1px solid var(--line); padding-left:4px; }
    .station strong { color:#c9be2e; font-size:clamp(9px,.65vw,15px); font-weight:600; }
    .station span { color:var(--white); font:700 clamp(10px,.85vw,19px) Consolas,monospace; font-variant-numeric:tabular-nums; }
    .footer { font-size:clamp(11px,.9vw,20px); font-weight:600; }
    .empty { padding:25px; }
    @media (min-width:1000px) and (min-height:700px) { .screen { height:100vh; } }
    @media (max-width:999px),(max-height:699px) {
      .screen { padding:14px; }
      #rows { grid-template-columns:1fr; gap:0; }
      .board-column { display:flex; flex-direction:column; }
      .row { min-height:100px; padding:10px; gap:8px; }
      .row-main { font-size:22px; }
      .brand { height:100px; }
      .brand img { width:min(80vw,600px); max-height:100px; }
      .station span { font-size:12px; }
      .station strong { font-size:10px; }
      .result-meta { font-size:11px; }
      .footer { flex-wrap:wrap; }
      button { padding:8px; }
    }
    @media (max-width:600px) {
      .heading { align-items:flex-start; flex-direction:column; }
      .row-main { font-size:19px; grid-template-columns:32px minmax(0,1fr) auto; }
      .members { font-size:12px; }
      .station-strip { grid-template-columns:repeat(4,minmax(0,1fr)); row-gap:6px; }
      .result-meta { max-width:120px; line-height:1.5; }
    }
  </style>
</head>
<body>
  <main class="screen">
    <div class="topbar"><span class="live">LIVE RANKING</span><span class="clock" id="clock"></span></div>
    <div class="brand"><img src="./assets/nanxi-main-visual-cropped.svg" alt="Nanxi主视觉"></div>
    <section class="heading">
      <div><h1 id="title">男子单人</h1></div>
      <div class="day-switch"><button class="active" data-day="19">9 月 19 日</button><button data-day="20">9 月 20 日</button></div>
    </section>
    <div class="group-switch" id="groups"></div>
    <section class="board" aria-label="排行榜">
      <div id="rows"></div>
    </section>
    <div class="footer"><span id="mockCount">Mock · 20 位选手</span><div class="pagination"><button id="prevPage" aria-label="上一页">‹</button><span id="pageInfo"></span><button id="nextPage" aria-label="下一页">›</button><button id="autoPage" aria-pressed="true">暂停轮播</button></div><span id="connection" role="status">正在读取成绩…</span></div>
  </main>
  <script src="./timing-api.js"></script><script src="./nanxi.js"></script>
  <script>
    const N = Nanxi, $ = selector=>document.querySelector(selector), params = new URLSearchParams(location.search);
    const demo = params.get('demo') === '1';
    let day = params.get('day') === '20' || params.get('raceId') === N.races[20] ? '20' : '19';
    let group = params.get('group') === 'all' || N.codes(day).includes(params.get('group')) ? (params.get('group') || 'all') : 'all';
    let page = 0, pageCount = 1, autoPage = true;
    const wide = matchMedia("(min-width:1000px) and (min-height:700px)");
    let payload = null, version = 0, loading = false, controller = null;
    const labels = {finished:'已完赛',racing:'比赛中',not_started:'未开始',paused:'暂停',dnf:'退赛',dns:'未出发'};
    document.querySelector('.day-switch').hidden = false;
    function controls() {
      $('#title').textContent = group === 'all' ? '全部组别' : N.groups[group].label;
      $('#groups').innerHTML = [`<button class="${group==='all'?'active':''}" aria-pressed="${group==='all'}" data-group="all">全部组别</button>`, ...N.codes(day).map(code=>`<button class="${code===group?'active':''}" aria-pressed="${code===group}" data-group="${code}">${N.groups[code].label}</button>`)].join('');
      document.querySelectorAll('[data-day]').forEach(button=>button.classList.toggle('active',button.dataset.day===day));

    }
    function render() {
      const entries = (payload?.leaderboard || []).filter(row=>group === 'all' || row.categoryCode === group);
      $('#mockCount').textContent = `${demo?'演示成绩 · ':''}${entries.length} 个参赛单位`;
      const perColumn = 10, pageSize = wide.matches ? 20 : 10;
      pageCount = Math.max(1, Math.ceil(entries.length / pageSize));
      page = Math.min(page, pageCount - 1);
      const visible = entries.slice(page * pageSize, (page + 1) * pageSize);
      $('#pageInfo').textContent = `${page+1} / ${pageCount} 页`;
      $('#prevPage').disabled = $('#nextPage').disabled = pageCount === 1;
      const rowHtml = row => `<div class="row" data-bib="${N.escape(row.bibNumber)}">
        <div class="row-main"><span class="rank">${row.categoryRank ?? row.rank ?? '—'}</span>
        <span class="name"><span class="id">${N.escape(row.bibNumber)}</span>${N.escape(row.athleteName)}${row.entryType==='individual'?'':`<small class="members">${(row.memberNames||[]).map(N.escape).join(' / ')}</small>`}</span>
        <span class="time">${N.duration(row.elapsedMs)}<small class="result-meta">${labels[row.status]||'待确认'} · 罚 +${N.duration(row.penaltyMs || 0)}${day==='20'?` · 减 −${N.duration(row.deductionMs || 0)}`:''}</small></span></div>
        <div class="station-strip" style="--station-count:${payload.race.stationCount}">${Array.from({length:payload.race.stationCount},(_,i)=>`<div class="station"><strong>S${i+1}</strong><span>${N.duration(row.stationSplits?.[`station${i+1}Ms`])}</span></div>`).join('')}</div>
      </div>`;
      const columnHtml = rows => `<section class="board-column"><div class="board-head"><span>名次</span><span>选手 / 队伍</span><span>总成绩</span></div>${rows.map(rowHtml).join('')}</section>`;
      $('#rows').innerHTML = visible.length ? Array.from({length:wide.matches?2:1},(_,i)=>columnHtml(visible.slice(i*perColumn,(i+1)*perColumn))).join('') : `<div class="empty">${payload?'该组别暂无参赛选手':'正在读取成绩…'}</div>`;
    }
    function turnPage(delta) { page = (page + delta + pageCount) % pageCount; render(); }
    $('#prevPage').addEventListener('click',()=>turnPage(-1));
    $('#nextPage').addEventListener('click',()=>turnPage(1));
    $('#autoPage').addEventListener('click',()=>{autoPage=!autoPage;$('#autoPage').textContent=autoPage?'暂停轮播':'开始轮播';$('#autoPage').setAttribute('aria-pressed',String(autoPage));});
    wide.addEventListener('change',()=>{page=0;render();});
    setInterval(()=>{if(autoPage && document.visibilityState==='visible')turnPage(1);},15000);

    async function refresh() {
      if (loading) return; loading=true; const current=version;
      controller=new AbortController(); const timeout=setTimeout(()=>controller.abort(),10000);
      try { const next=demo?N.mock(day):await N.fetchResults(day,controller.signal);if(current!==version)return;payload=next;render();$('#connection').textContent=`${demo?'演示':'已更新'} ${new Date(next.generatedAt).toLocaleTimeString('zh-CN',{hour12:false})}`; }
      catch(error) {if(current===version) {$('#connection').textContent=payload?'连接中断 · 保留上次成绩，正在重试':'无法连接成绩服务，正在重试';if(!payload)$('#rows').textContent='暂时无法读取成绩';}}
      finally {clearTimeout(timeout);if(current===version)loading=false;}
    }
    $('#groups').addEventListener('click',event=>{const button=event.target.closest('[data-group]');if(!button)return;group=button.dataset.group;page=0;controls();render();});
      document.querySelectorAll('[data-day]').forEach(button=>button.addEventListener('click',()=>{version++;controller?.abort();loading=false;payload=null;day=button.dataset.day;group='all';page=0;controls();render();refresh();}));
    controls();render();refresh();setInterval(()=>{if(document.visibilityState==='visible')refresh();},3000);
    setInterval(()=>$('#clock').textContent=new Date().toLocaleTimeString('zh-CN',{hour12:false}),1000);
  </script>
</body>
</html>
