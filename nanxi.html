<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0a08"><title>Nanxi · 实时排名</title>
  <style>
    :root { color-scheme:dark; font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif; --yellow:#fff04f; --white:#f5f5f5; --muted:#a9a99e; --line:#30302a; }
    * { box-sizing:border-box; } body { margin:0; background:#0a0a08; color:var(--white); }
    main { max-width:960px; margin:auto; padding:24px 20px 60px; } a { color:var(--yellow); text-decoration:none; }
    header { display:flex; justify-content:space-between; align-items:center; gap:20px; margin-bottom:26px; }
    .logo { width:min(380px,54vw); height:auto; filter:brightness(0) saturate(100%) invert(85%) sepia(94%) saturate(1260%) hue-rotate(4deg) brightness(104%) contrast(103%); }
    nav { display:flex; gap:14px; font-size:13px; } h1 { font-size:26px; margin:0 0 20px; }
    button,select,input { font:inherit; border:1px solid var(--line); background:#161612; color:var(--white); border-radius:6px; min-height:44px; }
    button { padding:10px 15px; cursor:pointer; font-weight:700; } button[aria-pressed="true"] { background:var(--yellow); color:#111; border-color:var(--yellow); }
    .days,.groups { display:flex; gap:8px; flex-wrap:wrap; } .days { margin-bottom:12px; } .days button { flex:1; }
    .groups { margin-bottom:18px; } .groups button { flex:1; white-space:nowrap; }
    input { width:100%; padding:12px 14px; } .meta { display:flex; justify-content:space-between; gap:12px; color:var(--muted); font-size:12px; margin:14px 0; line-height:1.5; }
    .error { color:#ffad91; } .entry { border-top:1px solid var(--line); } .entry:last-child { border-bottom:1px solid var(--line); }
    summary { display:grid; grid-template-columns:32px minmax(0,1fr) auto; gap:14px; align-items:center; padding:20px 0; list-style:none; cursor:pointer; }
    summary::-webkit-details-marker { display:none; } summary:focus-visible { outline:2px solid var(--yellow); outline-offset:2px; }
    .rank { color:var(--yellow); font-size:23px; font-weight:900; font-variant-numeric:tabular-nums; }
    .name { font-size:20px; font-weight:800; overflow-wrap:anywhere; } .members { font-size:13px; line-height:1.5; color:#d7d7cf; margin-top:5px; overflow-wrap:anywhere; }
    .bib { display:block; font:12px/1.6 monospace; margin-top:5px; color:var(--muted); } .total { text-align:right; }
    .time { color:var(--yellow); font:800 25px/1.2 ui-monospace,monospace; font-variant-numeric:tabular-nums; white-space:nowrap; }
    .status,.expand { font-size:12px; color:var(--muted); margin-top:7px; } .expand { color:#deded5; } details[open] .expand { visibility:hidden; }
    .detail { padding:0 0 20px 46px; } .splits { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:7px; }
    .split { padding:12px; border:1px solid var(--line); border-radius:4px; background:#12120f; } .split b { display:block; font-size:11px; color:var(--muted); margin-bottom:7px; } .split span { font:700 16px monospace; color:var(--white); }
    .adjustments { display:flex; flex-wrap:wrap; gap:12px; font-size:13px; color:#d7d7cf; margin-bottom:14px; } .detail a { display:inline-block; margin-top:16px; min-height:32px; font-size:13px; }
    .empty { color:var(--muted); padding:40px 0; text-align:center; } #demoNotice { color:var(--yellow); border:1px solid #514b13; padding:10px; font-size:13px; margin-bottom:15px; }
    @media(max-width:600px) { main { padding:18px 16px 40px; } header { align-items:flex-start; } nav { flex-direction:column; gap:10px; text-align:right; } .groups { gap:6px; } .groups button { font-size:13px; padding:9px; } .name { font-size:18px; } .time { font-size:22px; } summary { gap:10px; grid-template-columns:25px minmax(0,1fr) auto; } .rank { font-size:20px; } .detail { padding-left:0; } .members { font-size:12px; } }
  </style>
</head>
<body><main>
  <header><img class="logo" src="./assets/nanxi-main-visual-cropped.svg" alt="Nanxi"><nav><a href="./leaderboard.html">HOKA 赛事</a><a id="screenLink" href="./nanxi-leaderboard-preview.html">现场大屏</a><a id="finishLink" href="./finish-result.html">完赛打卡</a></nav></header>
  <h1>实时排名</h1>
  <div id="demoNotice" hidden>演示成绩 · 仅用于体验页面</div>
  <div class="days" aria-label="比赛日期"><button type="button" data-day="19">9 月 19 日</button><button type="button" data-day="20">9 月 20 日</button></div>
  <div class="groups" id="groups" aria-label="比赛组别"></div>
  <input id="search" type="search" placeholder="搜索选手号、姓名或队伍" aria-label="搜索选手号、姓名或队伍">
  <div class="meta"><span id="count"></span><span id="connection" role="status">正在读取成绩…</span></div>
  <section id="entries" aria-label="组别排名"></section>
</main>
<script src="./timing-api.js"></script><script src="./nanxi.js"></script>
<script>
  const N = window.Nanxi, $ = selector => document.querySelector(selector);
  const params = new URLSearchParams(location.search), demo = params.get('demo') === '1';
  let day = N.isRace(params.get('raceId')) ? N.dayForRace(params.get('raceId')) : params.get('day') === '20' ? '20' : '19';
  let group = params.get('group') === 'all' || N.codes(day).includes(params.get('group')) ? (params.get('group') || 'all') : 'all';
  let payload = null, version = 0, controller = null, loading = false;
  const openEntries = new Set();
  const statusLabels = {finished:'已完赛', racing:'比赛中', paused:'暂停', dnf:'退赛', dns:'未出发', not_started:'待出发'};
  $('#demoNotice').hidden = !demo;
  function link(page, extra = {}) { const query = new URLSearchParams({day, demo:demo?'1':'0', ...extra}); return `./${page}?${query}`; }
  function controls() {
    document.querySelectorAll('[data-day]').forEach(button => button.setAttribute('aria-pressed',String(button.dataset.day === day)));
    $('#groups').innerHTML = [`<button type="button" data-group="all" aria-pressed="${group === 'all'}">全部组别</button>`, ...N.codes(day).map(code => `<button type="button" data-group="${code}" aria-pressed="${code === group}">${N.groups[code].label}</button>`)].join('');
    $('#screenLink').href = link('nanxi-leaderboard-preview.html',{group}); $('#finishLink').href = link('finish-result.html');
    const url = new URL(location.href); url.searchParams.set('raceId',N.races[day]); url.searchParams.set('group',group); history.replaceState({},'',url);
  }
  function render() {
    const query = N.normalizeBib($('#search').value);
    const all = (payload?.leaderboard || []).filter(row => group === 'all' || row.categoryCode === group);
    const rows = all.filter(row => N.normalizeBib([row.bibNumber,row.athleteName,...(row.memberNames||[])].join(' ')).includes(query));
    const groupLabel = group === 'all' ? '全部组别' : N.groups[group].label;
    $('#count').textContent = `${groupLabel} · ${all.length} 个参赛单位${query ? ` · 找到 ${rows.length} 条` : ''}`;
    $('#entries').innerHTML = rows.length ? rows.map(row => {
      const e = N.escape, rank = row.categoryRank ?? row.rank ?? '—';
      const stationCount = payload.race.stationCount;
      return `<details class="entry" data-bib="${e(row.bibNumber)}" ${openEntries.has(row.bibNumber)?'open':''}><summary>
        <span class="rank">${rank}</span><div><div class="name">${e(row.athleteName)}</div>${row.entryType==='individual'?'':`<div class="members">${(row.memberNames||[]).map(e).join(' / ')}</div>`}<span class="bib">${e(row.bibNumber)}</span></div>
        <div class="total"><div class="time">${N.duration(row.elapsedMs)}</div><div class="status">${statusLabels[row.status] || '待确认'}</div><div class="expand">站点详情 ⌄</div></div></summary>
        <div class="detail"><div class="adjustments"><span>原始用时 ${N.duration(row.baseElapsedMs)}</span><span>罚时 +${N.duration(row.penaltyMs || 0)}</span>${day==='20'?`<span>接力减时 −${N.duration(row.deductionMs || 0)}</span>`:''}${Number(row.adjustmentMs||0)<Number(row.penaltyMs||0)?`<span>其他调整 −${N.duration((row.penaltyMs||0)-(row.adjustmentMs||0))}</span>`:''}</div>
        <div class="splits">${Array.from({length:stationCount},(_,i)=>`<div class="split"><b>S${i+1}</b><span>${N.duration(row.stationSplits?.[`station${i+1}Ms`])}</span></div>`).join('')}</div>
        ${row.status==='finished'?`<a href="${link('finish-result.html',{bib:row.bibNumber})}">查看完赛成绩 →</a>`:''}</div></details>`;
    }).join('') : `<div class="empty">${payload ? query ? '没有找到对应选手或队伍' : '该组别暂无参赛成绩' : '正在读取成绩…'}</div>`;
  }
  async function refresh() {
    if (loading) return; loading = true; const current = version;
    controller = new AbortController(); const timeout = setTimeout(()=>controller.abort(),10000);
    try {
      const next = demo ? N.mock(day) : await N.fetchResults(day,controller.signal);
      if (current !== version) return;
      payload = next; $('#connection').className = ''; $('#connection').textContent = `${demo?'演示':'已更新'} ${new Date(payload.generatedAt).toLocaleTimeString('zh-CN',{hour12:false})}`; render();
    } catch (error) {
      if (current !== version) return;
      $('#connection').className = 'error'; $('#connection').textContent = payload ? '连接中断 · 保留上次成绩，正在重试' : '暂时无法连接成绩服务，正在重试';
      if (!payload) $('#entries').innerHTML = '<div class="empty">暂时无法读取成绩</div>';
    } finally { clearTimeout(timeout); if (current === version) loading = false; }
  }
  $('#entries').addEventListener('toggle',event=>{ const entry=event.target; if(!entry.isConnected || !entry.matches('details'))return; if(entry.open)openEntries.add(entry.dataset.bib);else openEntries.delete(entry.dataset.bib); },true);
  $('#groups').addEventListener('click',event=>{const button=event.target.closest('[data-group]');if(!button)return;group=button.dataset.group;controls();render();});
  document.querySelectorAll('[data-day]').forEach(button=>button.addEventListener('click',()=>{if(day===button.dataset.day)return;version++;controller?.abort();loading=false;payload=null;openEntries.clear();day=button.dataset.day;group='all';controls();render();refresh();}));
  $('#search').addEventListener('input',render);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refresh();});
  controls(); render(); refresh(); setInterval(()=>{if(document.visibilityState==='visible')refresh();},5000);
</script></body></html>
